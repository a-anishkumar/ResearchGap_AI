version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchgap-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=${NEO4J_URI:-neo4j://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-researchgap123}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - VECTOR_DB_PATH=/app/data/chroma
      - DATA_RAW_PATH=/app/data/raw
    volumes:
      - backend_data:/app/data
    depends_on:
      - neo4j
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchgap-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20.0-community
    container_name: researchgap-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/researchgap123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  backend_data:
  neo4j_data:
  neo4j_logs:
